[package]
name = "vikram-voice"
description = "Helper-driven voice I/O for VIKRAM: capture, VAD, ASR, TTS and playback, with honest degradation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["gpu"]
# Vulkan is the one backend that covers Intel, AMD and NVIDIA GPUs on the platforms VIKRAM runs
# on, so it is the default: whisper.cpp loads it at runtime and falls back to CPU by itself when
# no Vulkan device exists. Build with --no-default-features for a CPU-only binary.
gpu = ["whisper-rs/vulkan"]

[dependencies]
thiserror.workspace = true
cpal = "0.18"
hound = "3.5"
whisper-rs = { version = "0.16", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
