[package]
name = "vikram-voice"
description = "Helper-driven voice I/O for VIKRAM: capture, VAD, ASR, TTS and playback, with honest degradation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
cpal = { version = "0.18", features = ["pipewire"] }
hound = "3.5"
# Pure Rust on wgpu: Vulkan on this machine, and it falls back to CPU by itself when no GPU
# device exists. `hub` adds model downloads; the CLI features of the crate stay off.
wavo = { version = "0.6", default-features = false, features = ["hub"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
