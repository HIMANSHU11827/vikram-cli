# =============================================================================
# PLACEHOLDER — THIS IS NOT A SECRET MANAGEMENT STRATEGY.
#
# The value below is a literal string, not a key. Committing a real key here puts
# it in git history forever, and `kubectl get secret -o yaml` hands it back to
# anyone with read access in the namespace (Secret is base64, not encryption;
# etcd encryption at rest is the only thing protecting it).
#
# Do one of these instead, then delete this file from kustomization.yaml:
#
#   1. Sealed Secrets (safe to commit):
#        kubeseal --format yaml --namespace vikram --name vikram-secrets \
#          --from-file=OPENAI_API_KEY=/dev/stdin < key.txt > k8s/secret.sealed.yaml
#
#   2. SOPS + age/KMS: keep the same shape, encrypt the values, commit the ciphertext.
#
#   3. External Secrets Operator: a SecretStore plus an ExternalSecret that pulls
#      from Vault/AWS Secrets Manager/GCP Secret Manager into `vikram-secrets`.
#
#   4. Out-of-band, no file in git at all (simplest for a single cluster):
#        kubectl create secret generic vikram-secrets \
#          --namespace vikram \
#          --from-literal=OPENAI_API_KEY='sk-...'
#
# Left as REPLACE_ME the pod still starts and stays Ready, because the readiness
# probe only checks the binary. Model calls then fail with a 401 from the provider.
# That is the intended loud-but-not-crashing failure: fix the Secret, not the pod.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: vikram-secrets
  namespace: vikram
  labels:
    app.kubernetes.io/name: vikram
    app.kubernetes.io/component: daemon
  annotations:
    vikram.dev/placeholder: "true"
type: Opaque
# stringData takes plain text and the API server base64-encodes it on write, which
# is what you want when authoring by hand. Use `data:` only if you are pasting an
# already-encoded value; mixing the two in one object is legal but confusing.
#
# The key name must match `api_key_env` in configmap.yaml ("OPENAI_API_KEY").
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
