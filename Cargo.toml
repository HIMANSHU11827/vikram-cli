[workspace]
resolver = "3"
members = [
    "crates/vikram-contracts",
    "crates/vikram-policy",
    "crates/vikram-store",
    "crates/vikram-runtime",
    "crates/vikram-tui",
    "crates/vikram-cli",
    "crates/vikram-skills",
    "crates/vikram-mcp",
    "crates/vikram-evolution",
    "crates/vikram-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VIKRAM-CLI/vikram"
rust-version = "1.86"

[workspace.dependencies]
vikram-contracts = { path = "crates/vikram-contracts" }
vikram-policy = { path = "crates/vikram-policy" }
vikram-store = { path = "crates/vikram-store" }
vikram-runtime = { path = "crates/vikram-runtime" }
vikram-tui = { path = "crates/vikram-tui" }
vikram-skills = { path = "crates/vikram-skills" }
vikram-mcp = { path = "crates/vikram-mcp" }
vikram-daemon = { path = "crates/vikram-daemon" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
    "signal",
] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "stream",
    "http2",
] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9"
clap = { version = "4.6", features = ["derive", "env"] }
unicode-width = "0.2"
insta = { version = "1.49", features = ["yaml"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

